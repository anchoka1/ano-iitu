<!doctype html>
<!--
  Mini App ANO IITU — честный помощник студента МУИТ. Одна HTML-страница, экраны рисует JavaScript (js/app.js).
  Адрес экрана — после # (например, #subjects), поэтому «Назад» и обновление страницы работают.
  Шесть учебных разделов внизу: Учёба, Предметы, Курс, План, Навигатор, IITU Hub. Профиль — кнопка в шапке.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F5">
  <title>ANO IITU</title>
  <!-- Официальный скрипт Telegram для Mini App: initData, тема, кнопки «Назад», вибрация. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Шрифт сайта МУИТ — Inter Tight. Без интернета сработает системный запасной шрифт. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="dev-banner" class="banner banner--warn" hidden></div>

  <header class="topbar">
    <div class="topbar__in">
      <!-- Логотип МУИТ (файл с iitu.edu.kz) — всегда на своём месте. -->
      <a class="logo" href="#home" aria-label="ANO IITU — на главный экран">
        <img class="logo__img" src="img/iitu-logo.svg" alt="МУИТ / IITU" width="134" height="22">
        <span class="logo__word">ANO</span>
      </a>
      <div class="topbar__text">
        <div id="greeting" class="topbar__sub"><span class="skeleton skeleton--text"></span></div>
      </div>
      <span id="demo-badge" class="badge" hidden></span>
      <a class="avatar-btn" href="#profile" aria-label="Профиль и настройки">👤<span class="avatar-btn__dot" id="profile-dot" hidden></span></a>
    </div>
  </header>

  <main id="view" class="page" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <div class="tabbar__in">
      <a href="#home" data-tab="home"><span class="tabbar__icon" aria-hidden="true">🎒</span><small>Учёба</small></a>
      <a href="#subjects" data-tab="subjects"><span class="tabbar__icon" aria-hidden="true">📚</span><small>Предметы</small></a>
      <a href="#course" data-tab="course"><span class="tabbar__icon" aria-hidden="true">🎓</span><small>Курс</small></a>
      <a href="#plan" data-tab="plan"><span class="tabbar__icon" aria-hidden="true">📅</span><small>План</small></a>
      <a href="#navigator" data-tab="navigator"><span class="tabbar__icon" aria-hidden="true">🧭</span><small>Навигатор</small></a>
      <a href="#hub" data-tab="hub"><span class="tabbar__icon" aria-hidden="true">💬</span><small>IITU Hub</small></a>
    </div>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
